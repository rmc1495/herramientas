<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Bitácoras PEI - Centro de IA</title>
    <!-- Estilos con Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- PDF.js para lectura de archivos -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Componentes de Iconos ---
        const IconFile = () => (<svg className="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5.586a1 1 0 0 1 .707.293l5.414 5.414a1 1 0 0 1 .293.707V19a2 2 0 0 0 2 2z"/></svg>);
        const IconUpload = () => (<svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>);
        const IconSparkles = () => (<svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>);
        const IconSettings = () => (<svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 0 0-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 0 0-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 0 0-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 0 0-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 0 0 1.066-2.573c-.94-1.543.826-3.31 2.37-2.37a1.724 1.724 0 0 0 2.572-1.065z"/><circle cx="12" cy="12" r="3" strokeWidth="2"/></svg>);
        const IconCopy = () => (<svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" strokeLinecap="round" strokeLinejoin="round"/></svg>);
        const IconTrash2 = () => (<svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" strokeLinecap="round" strokeLinejoin="round"/></svg>);

        function App() {
            const [bitacoras, setBitacoras] = useState([]);
            const [loading, setLoading] = useState(false);
            const [toast, setToast] = useState(null);
            const [aiLoadingId, setAiLoadingId] = useState(null);
            const [isSummarizingAll, setIsSummarizingAll] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            
            // --- Configuración de Proveedores ---
            const [provider, setProvider] = useState(localStorage.getItem('pei_provider') || "openrouter");
            const [config, setConfig] = useState({
                openrouter: { key: localStorage.getItem('pei_or_key') || "", model: localStorage.getItem('pei_or_model') || "google/gemini-2.0-flash-lite-preview-02-05:free", url: "https://openrouter.ai/api/v1/chat/completions" },
                groq: { key: localStorage.getItem('pei_groq_key') || "", model: localStorage.getItem('pei_groq_model') || "llama-3.3-70b-versatile", url: "https://api.groq.com/openai/v1/chat/completions" },
                nvidia: { key: localStorage.getItem('pei_nv_key') || "", model: localStorage.getItem('pei_nv_model') || "nvidia/llama-3.1-nemotron-70b-instruct", url: "https://integrate.api.nvidia.com/v1/chat/completions" },
                ollama: { key: "no-necesaria", model: localStorage.getItem('pei_ol_model') || "llama3", url: localStorage.getItem('pei_ol_url') || "http://localhost:11434/api/chat" }
            });

            useEffect(() => {
                if (window.pdfjsLib) {
                    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
                }
            }, []);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 5000);
            };

            const saveSettings = () => {
                localStorage.setItem('pei_provider', provider);
                localStorage.setItem('pei_or_key', config.openrouter.key);
                localStorage.setItem('pei_or_model', config.openrouter.model);
                localStorage.setItem('pei_groq_key', config.groq.key);
                localStorage.setItem('pei_groq_model', config.groq.model);
                localStorage.setItem('pei_nv_key', config.nvidia.key);
                localStorage.setItem('pei_nv_model', config.nvidia.model);
                localStorage.setItem('pei_ol_model', config.ollama.model);
                localStorage.setItem('pei_ol_url', config.ollama.url);
                setShowSettings(false);
                showToast("Configuración guardada correctamente.");
            };

            const callUniversalAI = async (text, retries = 2) => {
                const current = config[provider];
                if (!current.key && provider !== 'ollama') throw new Error(`Falta API Key para ${provider.toUpperCase()}`);

                const systemPrompt = "Eres un asistente administrativo experto. Resume de forma profesional y muy breve (máximo 50 palabras) las actividades educativas para una tabla de Excel. No uses negritas ni asteriscos.";
                const userPrompt = `Resume este texto:\n${text}`;

                try {
                    let response;
                    if (provider === 'ollama') {
                        response = await fetch(current.url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                model: current.model,
                                messages: [{ role: "system", content: systemPrompt }, { role: "user", content: userPrompt }],
                                stream: false
                            })
                        });
                    } else {
                        response = await fetch(current.url, {
                            method: 'POST',
                            headers: { 
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${current.key}`,
                                ...(provider === 'openrouter' ? { 'HTTP-Referer': window.location.href, 'X-Title': 'PEI Center' } : {})
                            },
                            body: JSON.stringify({
                                model: current.model, 
                                messages: [{ role: "system", content: systemPrompt }, { role: "user", content: userPrompt }]
                            })
                        });
                    }

                    if (!response.ok) {
                        const err = await response.json().catch(() => ({}));
                        throw new Error(err.error?.message || `Error ${response.status}`);
                    }

                    const data = await response.json();
                    const result = provider === 'ollama' ? data.message?.content : data.choices?.[0]?.message?.content;
                    if (!result) throw new Error("La IA no devolvió respuesta.");
                    return result.trim();
                } catch (error) {
                    if (retries > 0) {
                        await new Promise(r => setTimeout(r, 2000));
                        return callUniversalAI(text, retries - 1);
                    }
                    throw error;
                }
            };

            const handleSummarize = async (id, text) => {
                setAiLoadingId(id);
                try {
                    const summary = await callUniversalAI(text);
                    setBitacoras(prev => prev.map(b => b.id === id ? { ...b, asunto: summary } : b));
                    showToast(`✨ Resumen generado con ${provider.toUpperCase()}`);
                } catch (err) {
                    showToast(`❌ ${err.message}`, "error");
                } finally {
                    setAiLoadingId(null);
                }
            };

            const handleSummarizeAll = async () => {
                if (bitacoras.length === 0) return;
                setIsSummarizingAll(true);
                showToast(`⏳ Procesando con ${provider.toUpperCase()}...`, "success");
                for (let i = 0; i < bitacoras.length; i++) {
                    const row = bitacoras[i];
                    if (row.asunto && row.asunto.length > 50) {
                        setAiLoadingId(row.id);
                        try {
                            const summary = await callUniversalAI(row.asunto);
                            setBitacoras(prev => prev.map(b => b.id === row.id ? { ...b, asunto: summary } : b));
                        } catch (err) {
                            showToast(`⚠️ Error en fila ${i + 1}`, "error");
                        }
                    }
                }
                setAiLoadingId(null);
                setIsSummarizingAll(false);
                showToast("✅ Procesamiento masivo completado.");
            };

            const parseReunion = (fullText) => {
                let persona = "Participantes";
                const depto = fullText.match(/Departamento\s*\/?\s*Institución\s*:\s*(.*?)(?=Propósito|Fecha|$)/i);
                if (depto) persona = depto[1].trim();

                const start = fullText.match(/Propósito de la reunión:?|Asuntos tratados:?/i);
                const end = fullText.search(/Nombre de los docentes|Participantes:|Firma|Recibido/i);
                let asunto = fullText.substring(start ? start.index : 0, end > -1 ? end : fullText.length).trim();
                
                return { asunto: asunto || fullText.substring(0, 1500), persona };
            };

            const parseGrupo = (text) => {
                const secMatch = text.match(/Secci[oó]n\s*[:\-\.]?\s*(\d{1,2}\s*[-\/_]\s*\d+(?:\s*[\/\\]\s*\d+)?(?:\s+[A-Z]\b)?)/i);
                const seccion = secMatch ? "Sección " + secMatch[1].replace(/\s+/g, '').toUpperCase() : "";

                let carrera = "";
                const dict = {"Contabilidad y Finanzas": /FINANZAS/i, "Contabilidad y Costos": /COSTOS/i, "Desarrollo Web": /DESARROLLO/i, "Ejecutivo Comercial": /COMERCIAL/i};
                for (const [n, r] of Object.entries(dict)) { if (r.test(text)) { carrera = n; break; } }

                const block = text.match(/Unidad de estudio:\s*(.*?)(?=Nombre de los docentes|Firma|$)/i);
                return { asunto: block ? block[1].trim() : "Actividades de aula", persona: (seccion + (carrera ? " - " + carrera : "")).trim() };
            };

            const processPDF = async (file) => {
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await window.pdfjsLib.getDocument(arrayBuffer).promise;
                    let consecutivo = "N/D", fecha = "N/D", tipo = "BITÁCORA", pagesText = [], fullText = '';

                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const content = await page.getTextContent();
                        const text = content.items.map(s => s.str).join(' ').replace(/\s+/g, ' ');
                        pagesText.push(text); 
                        fullText += text + " ";
                        if (i === 1) {
                            const b = text.replace(/\s+/g, '').match(/([A-Z0-9]+-PEI-\d+-\d{4})/);
                            if (b) consecutivo = b[0];
                            if (text.includes("REUNIÓN")) tipo = "BITÁCORA DE ATENCIÓN A REUNIÓN";
                            else if (text.includes("GRUPOS")) tipo = "BITÁCORA DE ATENCIÓN A GRUPOS";
                            const f = text.match(/(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4})/);
                            if (f) fecha = f[0];
                        }
                    }

                    if (tipo.includes("REUNIÓN")) {
                        const data = parseReunion(fullText);
                        return [{ id: crypto.randomUUID(), bitacora: consecutivo, tipo, asunto: data.asunto, fecha, persona: data.persona }];
                    } else {
                        let grupos = [], personas = [];
                        for (const p of pagesText) {
                            if (p.length > 100) {
                                const data = parseGrupo(p);
                                if (!personas.includes(data.persona)) personas.push(data.persona);
                                grupos.push(`--- ${data.persona} ---\n${data.asunto}`);
                            }
                        }
                        return [{ id: crypto.randomUUID(), bitacora: consecutivo, tipo, asunto: grupos.join('\n\n'), fecha, persona: personas.join('\n') }];
                    }
                } catch (err) {
                    console.error("Error procesando PDF:", err);
                    return [];
                }
            };

            const handleFileUpload = async (e) => {
                const files = Array.from(e.target.files);
                if (!files.length) return;
                setLoading(true);
                const results = [];
                for (const file of files) {
                    const r = await processPDF(file);
                    results.push(...r);
                }
                setBitacoras(prev => [...prev, ...results]);
                setLoading(false);
                e.target.value = null;
                showToast("✅ Bitácoras cargadas con éxito.");
            };

            const updateCell = (id, field, val) => {
                setBitacoras(prev => prev.map(b => b.id === id ? { ...b, [field]: val } : b));
            };

            return (
                <div className="max-w-7xl mx-auto py-10 px-4">
                    <header className="bg-white p-8 rounded-3xl shadow-xl border border-gray-100 text-center mb-8 relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-green-400 to-blue-500"></div>
                        <button onClick={() => setShowSettings(!showSettings)} className="absolute right-6 top-6 p-2 bg-slate-50 border rounded-xl hover:bg-slate-100 transition-all"><IconSettings /></button>
                        <h1 className="text-4xl font-black text-gray-800 flex justify-center items-center gap-4">
                            <IconFile /> PEI Center IA
                        </h1>
                        <p className="text-gray-500 mt-2 font-medium tracking-tight text-lg">Procesador Inteligente de Bitácoras</p>
                    </header>

                    {showSettings && (
                        <div className="bg-white border-2 border-blue-100 rounded-3xl p-8 mb-8 shadow-2xl animate-in slide-in-from-top-4 duration-300">
                            <h3 className="font-bold text-gray-800 text-xl mb-6 flex items-center gap-2">Configuración Multi-IA</h3>
                            <div className="mb-6">
                                <label className="block text-xs font-black text-slate-400 uppercase mb-2 tracking-widest">Proveedor Activo</label>
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                                    {['openrouter', 'groq', 'nvidia', 'ollama'].map(p => (
                                        <button key={p} onClick={() => setProvider(p)} className={`p-3 rounded-xl font-bold uppercase text-xs border transition-all ${provider === p ? 'bg-blue-600 text-white border-blue-600 shadow-lg shadow-blue-200' : 'bg-white text-slate-500 hover:bg-slate-50'}`}>{p}</button>
                                    ))}
                                </div>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {provider !== 'ollama' && (
                                    <div>
                                        <label className="block text-xs font-black text-slate-400 uppercase mb-2 tracking-widest">API Key de {provider.toUpperCase()}</label>
                                        <input type="password" value={config[provider].key} onChange={(e) => setConfig({...config, [provider]: {...config[provider], key: e.target.value}})} className="w-full px-4 py-3 rounded-xl border outline-none focus:ring-4 focus:ring-blue-50 bg-slate-50 shadow-inner" placeholder="Pega tu clave aquí..." />
                                    </div>
                                )}
                                {provider === 'ollama' && (
                                    <div>
                                        <label className="block text-xs font-black text-slate-400 uppercase mb-2 tracking-widest">URL de Ollama</label>
                                        <input type="text" value={config.ollama.url} onChange={(e) => setConfig({...config, ollama: {...config.ollama, url: e.target.value}})} className="w-full px-4 py-3 rounded-xl border outline-none focus:ring-4 focus:ring-blue-50 bg-slate-50 shadow-inner" />
                                    </div>
                                )}
                                <div>
                                    <label className="block text-xs font-black text-slate-400 uppercase mb-2 tracking-widest">Modelo</label>
                                    <input type="text" value={config[provider].model} onChange={(e) => setConfig({...config, [provider]: {...config[provider], model: e.target.value}})} className="w-full px-4 py-3 rounded-xl border outline-none focus:ring-4 focus:ring-blue-50 bg-slate-50 shadow-inner" />
                                </div>
                            </div>
                            <button onClick={saveSettings} className="mt-8 w-full bg-slate-800 text-white py-4 rounded-2xl font-bold hover:bg-slate-900 transition-all shadow-xl">Guardar Cambios</button>
                        </div>
                    )}

                    <div className="flex flex-col lg:flex-row gap-6 mb-8 items-stretch">
                        <div className="flex-1 bg-white p-6 rounded-3xl shadow-lg border relative group cursor-pointer hover:border-green-300 transition-all text-center">
                            <input type="file" multiple accept=".pdf" onChange={handleFileUpload} className="absolute inset-0 opacity-0 cursor-pointer z-10" disabled={loading} />
                            <div className={`p-6 inline-block rounded-2xl mb-2 ${loading ? 'bg-slate-100' : 'bg-green-50 text-green-600'}`}>
                                {loading ? <div className="animate-spin h-10 w-10 border-4 border-green-600 border-t-transparent rounded-full"></div> : <IconUpload />}
                            </div>
                            <div className="font-bold text-gray-700 block text-lg tracking-tight">{loading ? "Analizando documentos..." : "Cargar Bitácoras PDF"}</div>
                        </div>
                        <div className="flex flex-col sm:flex-row lg:flex-col gap-4">
                            <div className="flex gap-2 h-full">
                                <button onClick={handleSummarizeAll} disabled={bitacoras.length === 0 || isSummarizingAll} className="flex-1 bg-purple-600 hover:bg-purple-700 text-white px-8 rounded-2xl font-bold flex items-center justify-center gap-3 transition-all shadow-lg shadow-purple-100 disabled:opacity-50 min-w-[180px]">
                                    {isSummarizingAll ? <div className="animate-spin h-5 w-5 border-2 border-white border-t-transparent rounded-full"></div> : <IconSparkles />}
                                    Resumir Todo
                                </button>
                                <button onClick={() => {
                                    const rows = bitacoras.map(b => [b.bitacora, b.tipo, `"${b.asunto.replace(/"/g, '""')}"`, b.fecha, `"${b.persona.replace(/"/g, '""')}"`].join("\t")).join("\n");
                                    const txt = document.createElement("textarea"); txt.value = rows; document.body.appendChild(txt); txt.select(); document.execCommand("copy"); document.body.removeChild(txt);
                                    showToast("📋 ¡Tabla copiada! Pega en Excel Celda A5.");
                                }} disabled={bitacoras.length === 0} className="flex-1 bg-blue-600 hover:bg-blue-700 text-white px-8 rounded-2xl font-bold flex items-center justify-center gap-3 transition-all shadow-lg shadow-blue-100 disabled:opacity-50 min-w-[150px]"><IconCopy /> Copiar</button>
                            </div>
                            <button onClick={() => setBitacoras([])} className="bg-white border text-red-500 px-8 py-3 rounded-2xl font-bold hover:bg-red-50 transition-all border-red-100">Limpiar Todo</button>
                        </div>
                    </div>

                    <div className="bg-white rounded-3xl shadow-2xl border border-gray-200 overflow-hidden overflow-x-auto">
                        <table className="w-full border-collapse table-fixed min-w-[1200px]">
                            <thead>
                                <tr className="bg-slate-800 text-white text-center font-black py-5 uppercase tracking-widest border-b border-slate-700"><th colSpan="5" className="py-5 text-xl tracking-tighter">Consecutivos Bitácoras Promotores PEI</th></tr>
                                <tr className="bg-[#558235] text-white text-left font-bold text-[10px] uppercase tracking-wider text-center">
                                    <th className="p-4 w-[15%] border-r border-white/10 tracking-widest">N° bitácora</th>
                                    <th className="p-4 w-[18%] border-r border-white/10 tracking-widest text-left px-6">Tipo</th>
                                    <th className="p-4 w-[42%] border-r border-white/10 tracking-widest text-left px-6">Asunto (IA: {provider})</th>
                                    <th className="p-4 w-[10%] border-r border-white/10 tracking-widest">Fecha</th>
                                    <th className="p-4 w-[15%] tracking-widest text-left px-6">Persona atendida</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100 text-center">
                                {bitacoras.length === 0 ? (
                                    <tr><td colSpan="5" className="p-20 text-center text-slate-300 italic text-xl font-light tracking-tight">Sube archivos PDF para empezar a procesar...</td></tr>
                                ) : bitacoras.map(b => (
                                    <tr key={b.id} className="group hover:bg-blue-50/10 transition-colors">
                                        <td className="p-4 bg-slate-500 text-white relative align-top font-mono text-[11px] font-bold">
                                            <div contentEditable suppressContentEditableWarning onBlur={(e) => updateCell(b.id, 'bitacora', e.target.innerText)} className="outline-none p-1 rounded uppercase tracking-tighter cursor-text">{b.bitacora}</div>
                                            <div className="absolute right-2 top-2 flex flex-col gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                                <button onClick={() => handleSummarize(b.id, b.asunto)} disabled={aiLoadingId === b.id || isSummarizingAll} className="p-2 bg-white rounded-xl shadow-lg text-purple-600 hover:scale-110 active:scale-95 transition-all">
                                                    {aiLoadingId === b.id ? <div className="animate-spin h-4 w-4 border-2 border-purple-600 border-t-transparent rounded-full"></div> : <IconSparkles />}
                                                </button>
                                                <button onClick={() => setBitacoras(prev => prev.filter(x => x.id !== b.id))} className="p-2 bg-white rounded-xl shadow-lg text-red-600 hover:scale-110 active:scale-95 transition-all"><IconTrash2 /></button>
                                            </div>
                                        </td>
                                        <td className="p-4 text-[10px] align-top text-gray-500 font-bold uppercase text-left leading-tight px-6" contentEditable suppressContentEditableWarning onBlur={(e) => updateCell(b.id, 'tipo', e.target.innerText)}>{b.tipo}</td>
                                        <td className={`p-4 text-[11px] align-top whitespace-pre-wrap leading-relaxed text-left px-6 ${aiLoadingId === b.id ? 'opacity-40 animate-pulse text-purple-800 font-bold' : 'text-slate-800'}`} contentEditable suppressContentEditableWarning onBlur={(e) => updateCell(b.id, 'asunto', e.target.innerText)}>
                                            {b.asunto}
                                        </td>
                                        <td className="p-4 text-center text-xs font-bold align-top text-slate-400" contentEditable suppressContentEditableWarning onBlur={(e) => updateCell(b.id, 'fecha', e.target.innerText)}>{b.fecha}</td>
                                        <td className="p-4 text-[11px] align-top whitespace-pre-wrap font-bold text-slate-700 text-left leading-relaxed tracking-tight px-6" contentEditable suppressContentEditableWarning onBlur={(e) => updateCell(b.id, 'persona', e.target.innerText)}>{b.persona}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    {toast && (
                        <div className={`fixed bottom-10 left-1/2 -translate-x-1/2 px-10 py-5 rounded-3xl shadow-2xl z-50 animate-bounce flex items-center gap-3 font-bold border-2 ${toast.type === 'error' ? 'bg-red-50 border-red-200 text-red-700' : 'bg-slate-900 border-slate-700 text-white'}`}>
                            {toast.message}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
