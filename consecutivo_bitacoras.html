<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Bitácoras PEI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Iconos ---
        const IconFile = () => (<svg className="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5.586a1 1 0 0 1 .707.293l5.414 5.414a1 1 0 0 1 .293.707V19a2 2 0 0 0 2 2z"/></svg>);
        const IconUpload = () => (<svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>);
        const IconSparkles = () => (<svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>);
        const IconBolt = () => (<svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>);
        const IconSettings = () => (<svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 0 0-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 0 0-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 0 0-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 0 0-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 0 0 1.066-2.573c-.94-1.543.826-3.31 2.37-2.37a1.724 1.724 0 0 0 2.572-1.065z"/><circle cx="12" cy="12" r="3" strokeWidth="2"/></svg>);
        const IconCopy = () => (<svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" strokeLinecap="round" strokeLinejoin="round"/></svg>);
        const IconTrash2 = () => (<svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" strokeLinecap="round" strokeLinejoin="round"/></svg>);
        const IconMagic = () => (<svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M15 4V2m0 14v-2M8 9h2M20 9h2M17.8 11.8L19 13M15 9h0M17.8 6.2L19 5M3 21l9-9M12.2 6.2L11 5"/></svg>);

        // ============================================================
        // RESUMIDOR LOCAL (sin API, sin internet, siempre funciona)
        // ============================================================
        function localSummarize(rawText) {
            if (!rawText || rawText.trim().length < 20) {
                return "Texto insuficiente para resumir.";
            }

            // Normaliza el texto y elimina los marcadores de sección "--- Sección ... ---"
            const text = rawText
                .replace(/---[^-]+---/g, ' ')
                .replace(/\s+/g, ' ')
                .replace(/•/g, ' ')
                .trim();

            // Extrae cada bloque temático buscando desde una etiqueta hasta la siguiente
            const extractSection = (labelRegex, stopRegex) => {
                const combined = new RegExp(labelRegex.source + '\\s*[:\\-]?\\s*(.+?)(?=' + stopRegex.source + '|$)', 'is');
                const m = text.match(combined);
                if (!m || !m[1]) return '';
                return m[1]
                    .replace(/\s+/g, ' ')
                    .replace(/^[:\-\s•]+/, '')
                    .trim();
            };

            const stopWords = /Unidad(?:\s+de\s+estudio)?|Resultado(?:\s+de\s+aprendizaje)?|Actividades|Observaciones|Nombre\s+del\s+docente|Firma|Recibido|OPORTUNIDADES/i;

            const unidad = extractSection(/Unidad(?:\s+de\s+estudio)?/i, stopWords);
            const resultado = extractSection(/Resultado(?:\s+de\s+aprendizaje)?/i, stopWords);
            const actividades = extractSection(/Actividades/i, stopWords);
            const observaciones = extractSection(/Observaciones/i, stopWords);

            // Recorta cada parte a longitud manejable
            const trim = (s, n) => {
                if (!s) return '';
                s = s.replace(/\.+$/, '');
                if (s.length <= n) return s;
                // Corta en el último espacio antes del límite para no partir palabras
                const cut = s.substring(0, n);
                const lastSpace = cut.lastIndexOf(' ');
                return (lastSpace > n * 0.6 ? cut.substring(0, lastSpace) : cut) + '...';
            };

            const partes = [];
            if (unidad) partes.push(`Unidad: ${trim(unidad, 80)}`);
            if (resultado) partes.push(`Resultado: ${trim(resultado, 90)}`);
            if (actividades) partes.push(`Actividades: ${trim(actividades, 120)}`);
            if (observaciones && observaciones.length > 5 && !/^n\/?a$|^ninguna?$/i.test(observaciones)) {
                partes.push(`Obs: ${trim(observaciones, 60)}`);
            }

            if (partes.length === 0) {
                // Fallback: primeras 45 palabras del texto limpio
                const words = text.split(/\s+/).slice(0, 45);
                return words.join(' ') + (text.split(/\s+/).length > 45 ? '...' : '');
            }

            return partes.join('. ') + '.';
        }

        function App() {
            const [bitacoras, setBitacoras] = useState([]);
            const [loading, setLoading] = useState(false);
            const [toast, setToast] = useState(null);
            const [aiLoadingId, setAiLoadingId] = useState(null);
            const [showSettings, setShowSettings] = useState(false);
            const [userApiKey, setUserApiKey] = useState(localStorage.getItem('bitacora_gemini_key') || "");
            const [selectedModel, setSelectedModel] = useState(localStorage.getItem('bitacora_gemini_model') || "gemini-2.5-flash");
            const [diagnostico, setDiagnostico] = useState(null); // Muestra detalles técnicos de errores
            const [batchProgress, setBatchProgress] = useState(null); // {current, total, errors}

            useEffect(() => {
                if (window.pdfjsLib) {
                    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
                }
            }, []);

            const showToast = (message, type = 'success', duration = 5000) => {
                setToast({ message, type });
                setTimeout(() => setToast(null), duration);
            };

            const saveSettings = () => {
                localStorage.setItem('bitacora_gemini_key', userApiKey.trim());
                localStorage.setItem('bitacora_gemini_model', selectedModel);
                setShowSettings(false);
                showToast("✅ Configuración guardada.");
            };

            // ============================================================
            // LLAMADA GEMINI CON DIAGNÓSTICO EXHAUSTIVO
            // ============================================================
            const callGeminiAI = async (text) => {
                const apiKey = userApiKey.trim();
                if (!apiKey) throw new Error("Sin API Key configurada.");
                
                const cleanInput = (text || "").replace(/\s+/g, ' ').trim();
                if (cleanInput.length < 20) throw new Error("Texto muy corto.");
                
                const model = selectedModel || "gemini-2.5-flash";
                // Usamos ?key= en URL (compatibilidad universal) Y el header (por si acaso)
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`;
                
                const prompt = `Resume de forma profesional y muy breve (máximo 50 palabras, sin negritas ni asteriscos ni viñetas) las siguientes actividades educativas para una tabla de Excel:\n\n${cleanInput}\n\nResponda solo con el resumen.`;

                const requestBody = {
                    contents: [{ parts: [{ text: prompt }] }]
                };

                console.log("[Gemini] Request →", { url: url.replace(apiKey, "***"), model, textLen: cleanInput.length });

                let response, rawBody;
                try {
                    response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(requestBody)
                    });
                } catch (netErr) {
                    // Error de red / CORS / DNS / sin internet
                    console.error("[Gemini] Network error:", netErr);
                    throw new Error(`Sin conexión con Gemini: ${netErr.message}. Verifique internet, firewall o proxy.`);
                }

                try {
                    rawBody = await response.text();
                } catch (e) {
                    rawBody = "(no se pudo leer el cuerpo de respuesta)";
                }

                console.log("[Gemini] Response ←", response.status, rawBody.substring(0, 500));

                let data = null;
                try { data = JSON.parse(rawBody); } catch (e) { /* no era JSON */ }

                if (!response.ok) {
                    const apiMsg = data?.error?.message || rawBody.substring(0, 200) || `HTTP ${response.status}`;
                    // Guardar diagnóstico completo para el modal
                    setDiagnostico({
                        status: response.status,
                        statusText: response.statusText,
                        model,
                        endpoint: url.replace(apiKey, "***"),
                        respuestaCompleta: rawBody,
                        mensajeGoogle: data?.error?.message || "(sin mensaje)",
                        codigoGoogle: data?.error?.code || "(sin código)",
                        statusGoogle: data?.error?.status || "(sin status)"
                    });
                    throw new Error(`HTTP ${response.status}: ${apiMsg.substring(0, 150)}`);
                }

                const candidate = data?.candidates?.[0];
                if (!candidate) {
                    setDiagnostico({ tipo: "Respuesta vacía", respuestaCompleta: rawBody });
                    throw new Error("La IA no devolvió respuesta.");
                }
                if (candidate.finishReason === "SAFETY") {
                    throw new Error("Respuesta bloqueada por filtros de seguridad de Google.");
                }
                const resultText = candidate.content?.parts?.[0]?.text;
                if (!resultText) throw new Error("La IA devolvió una respuesta vacía.");
                return resultText.trim();
            };

            const handleSummarizeAI = async (id, text) => {
                if (!userApiKey.trim()) {
                    showToast("⚙️ Configure una API Key de Gemini o use el resumidor local (⚡)", "error", 7000);
                    setShowSettings(true);
                    return;
                }
                setAiLoadingId(id);
                try {
                    const summary = await callGeminiAI(text);
                    setBitacoras(prev => prev.map(b => b.id === id ? { ...b, asunto: summary } : b));
                    showToast("✨ Resumen IA generado.");
                } catch (err) {
                    console.error("Error IA:", err);
                    showToast(`❌ ${err.message} — Clic aquí para ver diagnóstico técnico.`, "error", 10000);
                } finally {
                    setAiLoadingId(null);
                }
            };

            const handleSummarizeLocal = (id, text) => {
                try {
                    const summary = localSummarize(text);
                    setBitacoras(prev => prev.map(b => b.id === id ? { ...b, asunto: summary } : b));
                    showToast("⚡ Resumen local generado.");
                } catch (err) {
                    showToast(`❌ ${err.message}`, "error");
                }
            };

            const handleSummarizeAllLocal = () => {
                setBitacoras(prev => prev.map(b => ({ ...b, asunto: localSummarize(b.asunto) })));
                showToast(`⚡ ${bitacoras.length} bitácoras resumidas localmente.`);
            };

            const handleSummarizeAllAI = async () => {
                if (!userApiKey.trim()) {
                    showToast("⚙️ Configure una API Key de Gemini primero", "error", 7000);
                    setShowSettings(true);
                    return;
                }
                if (bitacoras.length === 0) return;
                
                // Confirmación previa si son muchas (cuidar cuotas)
                if (bitacoras.length > 5) {
                    const ok = window.confirm(`Se enviarán ${bitacoras.length} solicitudes a Gemini. Esto puede tardar y consumir su cuota gratuita (nivel gratis: 15 solicitudes por minuto).\n\n¿Continuar?`);
                    if (!ok) return;
                }

                const total = bitacoras.length;
                const errores = [];
                setBatchProgress({ current: 0, total, errors: 0 });

                for (let i = 0; i < bitacoras.length; i++) {
                    const b = bitacoras[i];
                    setBatchProgress({ current: i + 1, total, errors: errores.length });
                    setAiLoadingId(b.id);
                    
                    try {
                        const summary = await callGeminiAI(b.asunto);
                        setBitacoras(prev => prev.map(x => x.id === b.id ? { ...x, asunto: summary } : x));
                    } catch (err) {
                        console.error(`Error en bitácora ${b.bitacora}:`, err);
                        errores.push({ bitacora: b.bitacora, error: err.message });
                    }
                    
                    // Pausa entre solicitudes para respetar límite de 15 req/min (4s = seguro)
                    // Con 15 req/min = 1 cada 4s. Usamos 4.2s para tener margen.
                    if (i < bitacoras.length - 1) {
                        await new Promise(r => setTimeout(r, 4200));
                    }
                }

                setAiLoadingId(null);
                setBatchProgress(null);

                if (errores.length === 0) {
                    showToast(`✨ ${total} bitácoras resumidas con IA correctamente.`, "success", 6000);
                } else if (errores.length === total) {
                    showToast(`❌ Fallaron TODAS (${total}). Revise el diagnóstico técnico.`, "error", 10000);
                } else {
                    showToast(`⚠️ ${total - errores.length} exitosas, ${errores.length} fallidas. Revise consola (F12).`, "error", 8000);
                }
            };

            // --- EXTRACCIÓN DE DATOS (intacta) ---
            const extractInfo = (fullText, pages) => {
                const cleanText = fullText.replace(/\s+/g, ' ');
                const textFlat = fullText.replace(/\s+/g, '').toUpperCase();

                let consecutivo = "N/D";
                const conMatch = textFlat.match(/([A-Z0-9]+-PEI-\d+-\d{4})/) || textFlat.match(/(PEI-\d+-\d{4})/);
                if (conMatch) consecutivo = conMatch[0];

                let tipo = "BITÁCORA";
                if (/ATENCI.N\s*A\s*GRUPOS/i.test(cleanText)) tipo = "BITÁCORA DE ATENCIÓN A GRUPOS";
                else if (/REUNI.N/i.test(cleanText)) tipo = "BITÁCORA DE ATENCIÓN A REUNIÓN";

                const fMatch = cleanText.match(/(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4})/);
                const fecha = fMatch ? fMatch[0] : "N/D";

                if (tipo.includes("GRUPOS")) {
                    let personasEncontradas = [];
                    let contenidosAsunto = [];

                    pages.forEach(p => {
                        if (p.length < 100) return;
                        const secMatch = p.match(/Secci[oó]n\s*[:\-\.]?\s*(\d{1,2}\s*[-\/_]\s*\d+(?:\s*[\/\\]\s*\d+)?(?:\s+[A-Z]\b)?)/i);
                        let seccionStr = secMatch ? "Sección " + secMatch[1].replace(/\s+/g, '').toUpperCase() : "";
                        let carreraStr = "";
                        const catalogo = {
                            "Contabilidad y Finanzas": /CONTABILIDAD\s*Y\s*FINANZAS/i,
                            "Contabilidad y Costos": /CONTABILIDAD\s*Y\s*COSTOS/i,
                            "Ejecutivo Comercial": /EJECUTIVO\s*COMERCIAL/i,
                            "Desarrollo Web": /DESARROLLO\s*WEB/i,
                            "Secretariado Ejecutivo": /SECRETARIADO\s*EJECUTIVO/i,
                            "Ciberseguridad": /CIBERSEGURIDAD/i,
                            "Contabilidad": /CONTABILIDAD/i
                        };
                        for (const [nombre, regex] of Object.entries(catalogo)) {
                            if (regex.test(p)) { carreraStr = nombre; break; }
                        }
                        const identificador = (seccionStr + (carreraStr ? " - " + carreraStr : "")).trim() || "Grupo Estudiantes";
                        if (!personasEncontradas.includes(identificador)) {
                            personasEncontradas.push(identificador);
                            const mAsunto = p.match(/(?:Unidad|Resultado|Actividades|OPORTUNIDADES)[\s\S]*?(?=Nombre del docente|Firma|Recibido|$)/i);
                            let asTexto = mAsunto ? mAsunto[0].replace(/\s+/g, ' ')
                                .replace(/Unidad de estudio:?/gi, "\n• Unidad: ")
                                .replace(/Resultado de aprendizaje:?/gi, "\n• Resultado: ")
                                .replace(/Actividades:?/gi, "\n• Actividades: ")
                                .replace(/Observaciones:?/gi, "\n• Observaciones: ").trim() : "";
                            contenidosAsunto.push(`--- ${identificador} ---\n${asTexto}`);
                        }
                    });
                    return { id: Math.random(), bitacora: consecutivo, tipo, fecha, persona: personasEncontradas.join("\n"), asunto: contenidosAsunto.join("\n\n") };
                }
                return { id: Math.random(), bitacora: consecutivo, tipo, fecha, persona: "Dirección / Técnica", asunto: cleanText.substring(0, 1000) };
            };

            const handleFileUpload = async (e) => {
                const files = Array.from(e.target.files);
                if (!files.length) return;
                setLoading(true);
                const results = [];
                for (const file of files) {
                    try {
                        const arrayBuffer = await file.arrayBuffer();
                        const pdf = await window.pdfjsLib.getDocument(arrayBuffer).promise;
                        let fullText = "";
                        let pages = [];
                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const content = await page.getTextContent();
                            const text = content.items.map(s => s.str).join(" ");
                            pages.push(text);
                            fullText += text + " ";
                        }
                        results.push(extractInfo(fullText, pages));
                    } catch (err) {
                        showToast("Error en: " + file.name, "error");
                    }
                }
                setBitacoras(prev => [...prev, ...results]);
                setLoading(false);
                e.target.value = null;
                showToast("✅ Bitácoras procesadas.");
            };

            const updateCell = (id, field, val) => {
                setBitacoras(prev => prev.map(b => b.id === id ? { ...b, [field]: val } : b));
            };

            const testConnection = async () => {
                if (!userApiKey.trim()) { showToast("⚠️ Ingrese una API Key primero", "error"); return; }
                showToast("🔄 Probando conexión...", "success", 2000);
                try {
                    const result = await callGeminiAI("Prueba de conexión. Responda solo la palabra: OK.");
                    showToast(`✅ ¡Conexión exitosa! Respuesta: "${result.substring(0, 80)}"`, "success", 7000);
                } catch (err) {
                    showToast(`❌ ${err.message} — Revise el diagnóstico`, "error", 10000);
                }
            };

            return (
                <div className="max-w-7xl mx-auto py-10 px-4">
                    <header className="bg-white p-8 rounded-3xl shadow-xl border border-gray-100 text-center mb-8 relative">
                        <div className="absolute top-0 left-0 w-full h-2 bg-green-500"></div>
                        <button onClick={() => setShowSettings(!showSettings)} className="absolute right-6 top-6 text-gray-400 hover:text-green-600 transition-colors p-2" title="Configuración"><IconSettings /></button>
                        <h1 className="text-4xl font-black text-gray-800 flex justify-center items-center gap-4">
                            <IconFile /> Generador PEI
                        </h1>
                        <p className="text-gray-500 mt-2">Carga tus bitácoras y genera el cuadro para Excel automáticamente.</p>
                        <div className="mt-4 flex flex-wrap items-center justify-center gap-3 text-xs">
                            <span className="inline-flex items-center gap-2 bg-green-50 border border-green-200 text-green-800 px-3 py-1.5 rounded-full font-semibold">
                                <IconBolt /> Resumidor Local: siempre disponible
                            </span>
                            <span className={`inline-flex items-center gap-2 border px-3 py-1.5 rounded-full font-semibold ${userApiKey ? 'bg-purple-50 border-purple-200 text-purple-800' : 'bg-amber-50 border-amber-200 text-amber-800'}`}>
                                <IconSparkles /> IA Gemini: {userApiKey ? 'configurada' : 'no configurada'}
                            </span>
                        </div>
                    </header>

                    {showSettings && (
                        <div className="bg-blue-50 border-2 border-blue-200 rounded-3xl p-6 mb-8">
                            <h3 className="font-bold text-blue-900 mb-2 text-lg">Configuración de Gemini IA (opcional)</h3>
                            <p className="text-blue-700 text-sm mb-4">Obtenga su API Key gratis en <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" className="underline font-bold">aistudio.google.com/apikey</a>. Si no la configura, use el botón <b>⚡ Local</b> que no requiere internet.</p>
                            
                            <label className="block text-xs font-bold text-blue-900 mb-1 uppercase">API Key</label>
                            <input type="password" value={userApiKey} onChange={(e) => setUserApiKey(e.target.value)} placeholder="AIzaSy..." className="w-full px-4 py-3 rounded-xl border border-blue-300 outline-none focus:ring-4 focus:ring-blue-100 mb-4 font-mono text-sm" />
                            
                            <label className="block text-xs font-bold text-blue-900 mb-1 uppercase">Modelo</label>
                            <select value={selectedModel} onChange={(e) => setSelectedModel(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-blue-300 outline-none focus:ring-4 focus:ring-blue-100 mb-4 bg-white">
                                <option value="gemini-2.5-flash">gemini-2.5-flash (recomendado)</option>
                                <option value="gemini-2.5-flash-lite">gemini-2.5-flash-lite</option>
                                <option value="gemini-2.5-pro">gemini-2.5-pro</option>
                                <option value="gemini-2.0-flash">gemini-2.0-flash</option>
                                <option value="gemini-2.0-flash-lite">gemini-2.0-flash-lite</option>
                            </select>

                            <div className="flex gap-3 flex-wrap">
                                <button onClick={saveSettings} className="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-blue-700">Guardar</button>
                                <button onClick={testConnection} className="bg-purple-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-purple-700">🧪 Probar conexión</button>
                                <button onClick={() => setShowSettings(false)} className="bg-white border border-gray-300 text-gray-600 px-6 py-3 rounded-xl font-bold hover:bg-gray-50">Cerrar</button>
                            </div>
                        </div>
                    )}

                    {diagnostico && (
                        <div className="bg-red-50 border-2 border-red-300 rounded-3xl p-6 mb-8">
                            <div className="flex justify-between items-start mb-3">
                                <h3 className="font-bold text-red-900 text-lg">🔬 Diagnóstico técnico del error</h3>
                                <button onClick={() => setDiagnostico(null)} className="text-red-600 font-bold text-xl">✕</button>
                            </div>
                            <div className="text-sm text-red-800 space-y-2 font-mono bg-white p-4 rounded-xl border border-red-200 overflow-x-auto">
                                {diagnostico.status && <div><b>HTTP Status:</b> {diagnostico.status} {diagnostico.statusText}</div>}
                                {diagnostico.model && <div><b>Modelo usado:</b> {diagnostico.model}</div>}
                                {diagnostico.codigoGoogle && <div><b>Código Google:</b> {diagnostico.codigoGoogle}</div>}
                                {diagnostico.statusGoogle && <div><b>Status Google:</b> {diagnostico.statusGoogle}</div>}
                                {diagnostico.mensajeGoogle && <div><b>Mensaje Google:</b> {diagnostico.mensajeGoogle}</div>}
                                <div className="mt-3">
                                    <b>Respuesta completa:</b>
                                    <pre className="mt-1 text-xs whitespace-pre-wrap bg-gray-50 p-2 rounded max-h-60 overflow-y-auto">{diagnostico.respuestaCompleta || "(vacío)"}</pre>
                                </div>
                            </div>
                            <p className="text-xs text-red-700 mt-3">📋 Copie este diagnóstico y compártalo para obtener ayuda específica.</p>
                        </div>
                    )}

                    <div className="flex flex-col md:flex-row gap-6 mb-8 items-stretch">
                        <div className="flex-1 bg-white p-6 rounded-3xl shadow-lg border border-gray-100 relative group cursor-pointer hover:border-green-300 transition-all text-center">
                            <input type="file" multiple accept=".pdf" onChange={handleFileUpload} className="absolute inset-0 opacity-0 cursor-pointer z-10" disabled={loading} />
                            <div className={`p-4 inline-block rounded-2xl mb-2 ${loading ? 'bg-gray-100' : 'bg-green-50 text-green-600'}`}>
                                {loading ? <div className="animate-spin h-8 w-8 border-4 border-green-600 border-t-transparent rounded-full"></div> : <IconUpload />}
                            </div>
                            <div className="font-bold text-gray-700 block">{loading ? "Procesando..." : "Subir Bitácoras PDF"}</div>
                        </div>
                        <div className="flex flex-col gap-2">
                            <button onClick={handleSummarizeAllLocal} disabled={bitacoras.length === 0 || batchProgress} className="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-2xl font-bold flex items-center justify-center gap-2 shadow-lg disabled:opacity-40"><IconBolt /> Resumir TODAS (Local)</button>
                            <button onClick={handleSummarizeAllAI} disabled={bitacoras.length === 0 || batchProgress} className="bg-purple-600 hover:bg-purple-700 text-white px-6 py-3 rounded-2xl font-bold flex items-center justify-center gap-2 shadow-lg disabled:opacity-40"><IconSparkles /> Resumir TODAS (IA Gemini)</button>
                            <button onClick={() => {
                                const rows = bitacoras.map(b => [b.bitacora, b.tipo, `"${b.asunto.replace(/"/g, '""')}"`, b.fecha, `"${b.persona.replace(/"/g, '""')}"`].join("\t")).join("\n");
                                const txt = document.createElement("textarea"); txt.value = rows; document.body.appendChild(txt); txt.select(); document.execCommand("copy"); document.body.removeChild(txt);
                                showToast("📋 Copiado. Pega en Excel.");
                            }} disabled={bitacoras.length === 0} className="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-2xl font-bold flex items-center justify-center gap-2 shadow-lg disabled:opacity-40"><IconCopy /> Copiar Tabla</button>
                            <button onClick={() => setBitacoras([])} disabled={batchProgress} className="bg-white border-2 border-red-100 text-red-600 px-6 py-2 rounded-2xl font-bold hover:bg-red-50 text-sm disabled:opacity-40">Limpiar</button>
                        </div>
                    </div>

                    {batchProgress && (
                        <div className="bg-purple-50 border-2 border-purple-300 rounded-3xl p-5 mb-6">
                            <div className="flex items-center justify-between mb-2">
                                <div className="flex items-center gap-3 text-purple-900 font-bold">
                                    <div className="animate-spin h-5 w-5 border-2 border-purple-600 border-t-transparent rounded-full"></div>
                                    Procesando con Gemini IA: {batchProgress.current} de {batchProgress.total}
                                </div>
                                {batchProgress.errors > 0 && (
                                    <span className="text-red-700 text-sm font-bold">⚠️ {batchProgress.errors} con error</span>
                                )}
                            </div>
                            <div className="w-full bg-purple-200 rounded-full h-3 overflow-hidden">
                                <div 
                                    className="bg-purple-600 h-full transition-all duration-500 rounded-full"
                                    style={{ width: `${(batchProgress.current / batchProgress.total) * 100}%` }}
                                ></div>
                            </div>
                            <p className="text-xs text-purple-700 mt-2">Pausa de ~4 segundos entre solicitudes para respetar el límite gratuito de Gemini (15/min). Tiempo estimado: {Math.ceil((batchProgress.total - batchProgress.current) * 4.5)}s restantes.</p>
                        </div>
                    )}

                    <div className="bg-white rounded-3xl shadow-2xl border border-gray-200 overflow-hidden overflow-x-auto">
                        <table className="w-full border-collapse table-fixed min-w-[1200px]">
                            <thead>
                                <tr className="bg-gray-800 text-white text-center font-black py-4 uppercase"><th colSpan="5" className="py-4">Consecutivos Bitácoras PEI</th></tr>
                                <tr className="bg-[#558235] text-white text-left font-bold text-[10px] uppercase tracking-wider">
                                    <th className="p-4 w-[15%] border-r border-green-600/30">N° bitácora</th>
                                    <th className="p-4 w-[20%] border-r border-green-600/30">Tipo</th>
                                    <th className="p-4 w-[35%] border-r border-green-600/30">Asunto</th>
                                    <th className="p-4 w-[10%] border-r border-green-600/30">Fecha</th>
                                    <th className="p-4 w-[20%]">Persona atendida</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100">
                                {bitacoras.length === 0 ? (
                                    <tr><td colSpan="5" className="p-20 text-center text-gray-300 italic text-xl font-light">Sube tus archivos PDF para comenzar...</td></tr>
                                ) : bitacoras.map(b => (
                                    <tr key={b.id} className="group hover:bg-blue-50/20">
                                        <td className="p-4 bg-gray-500 text-white relative align-top font-mono text-[11px] font-bold">
                                            <div contentEditable suppressContentEditableWarning onBlur={(e) => updateCell(b.id, 'bitacora', e.target.innerText)} className="outline-none focus:ring-2 focus:ring-white p-1 rounded">{b.bitacora}</div>
                                            <button onClick={() => setBitacoras(prev => prev.filter(x => x.id !== b.id))} className="absolute right-2 top-2 p-2 bg-white rounded-xl shadow-lg text-red-600 hover:scale-110 transition-transform opacity-0 group-hover:opacity-100" title="Eliminar"><IconTrash2 /></button>
                                        </td>
                                        <td className="p-4 text-[10px] align-top text-gray-600" contentEditable suppressContentEditableWarning onBlur={(e) => updateCell(b.id, 'tipo', e.target.innerText)}>{b.tipo}</td>
                                        <td className="p-4 align-top relative">
                                            <div className={`text-[11px] whitespace-pre-wrap leading-relaxed pr-16 ${aiLoadingId === b.id ? 'opacity-40 animate-pulse text-purple-800' : 'text-gray-800'}`} contentEditable suppressContentEditableWarning onBlur={(e) => updateCell(b.id, 'asunto', e.target.innerText)}>
                                                {aiLoadingId === b.id ? "Generando resumen..." : b.asunto}
                                            </div>
                                            <div className="absolute right-2 top-2 flex flex-col gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                                <button onClick={() => handleSummarizeLocal(b.id, b.asunto)} className="p-2 bg-green-600 text-white rounded-xl shadow-lg hover:scale-110 hover:bg-green-700 transition-all" title="Resumen LOCAL (sin internet)"><IconBolt /></button>
                                                <button onClick={() => handleSummarizeAI(b.id, b.asunto)} disabled={aiLoadingId === b.id} className="p-2 bg-purple-600 text-white rounded-xl shadow-lg hover:scale-110 hover:bg-purple-700 transition-all disabled:opacity-50" title="Resumen con IA Gemini"><IconSparkles /></button>
                                            </div>
                                        </td>
                                        <td className="p-4 text-center text-xs font-bold align-top text-gray-500" contentEditable suppressContentEditableWarning onBlur={(e) => updateCell(b.id, 'fecha', e.target.innerText)}>{b.fecha}</td>
                                        <td className="p-4 text-[11px] align-top whitespace-pre-wrap font-semibold text-gray-600" contentEditable suppressContentEditableWarning onBlur={(e) => updateCell(b.id, 'persona', e.target.innerText)}>{b.persona}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    <footer className="text-center text-gray-400 text-xs mt-8">
                        <p>💡 <b>Botón verde ⚡</b>: resumen local (sin internet, siempre funciona) — <b>Botón morado ✨</b>: resumen con IA Gemini (requiere API Key)</p>
                    </footer>

                    {toast && (
                        <div onClick={() => diagnostico && setToast(null)} className={`fixed bottom-10 left-1/2 -translate-x-1/2 px-6 py-4 rounded-3xl shadow-2xl z-50 flex items-center gap-3 font-bold border-2 max-w-2xl cursor-pointer ${toast.type === 'error' ? 'bg-red-50 border-red-200 text-red-700' : 'bg-gray-900 border-gray-700 text-white'}`}>
                            {toast.type !== 'error' && <div className="bg-green-500 rounded-full p-1 flex-shrink-0"><svg className="h-4 w-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"/></svg></div>}
                            <span className="text-sm">{toast.message}</span>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
