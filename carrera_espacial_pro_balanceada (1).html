<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚀 Carrera Espacial PRO | Mente Maestra</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #050914; --glass-bg: rgba(16, 24, 48, 0.7); --glass-border: rgba(65, 88, 208, 0.4);
    --neon-blue: #00f0ff; --neon-pink: #ff007f; --neon-green: #00ff66;
    --neon-yellow: #ffde00; --neon-orange: #ff7300; --text-main: #e2e8f0; --text-muted: #94a3b8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Outfit', sans-serif; background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; overflow-x: hidden; position: relative; }

  /* Scanlines CRT Effect */
  body::after {
    content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
    z-index: 999; background-size: 100% 3px, 6px 100%; pointer-events: none;
  }

  .nebula { position: fixed; width: 60vw; height: 60vw; border-radius: 50%; filter: blur(100px); opacity: 0.15; z-index: 0; pointer-events: none; transition: background 1s ease; }
  .nebula-1 { top: -20%; left: -10%; background: var(--neon-blue); }
  .nebula-2 { bottom: -20%; right: -10%; background: var(--neon-pink); }
  body.danger-mode .nebula-1 { background: #ff0000; opacity: 0.3; }
  body.danger-mode .nebula-2 { background: var(--neon-orange); opacity: 0.3; }

  canvas#starfield { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
  canvas#confetti { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 998; pointer-events: none; }
  
  #app { position: relative; z-index: 10; max-width: 950px; margin: 0 auto; padding: 20px; min-height: 100vh; display: flex; flex-direction: column; }

  .glass-panel { background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: 24px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5); padding: 30px; }
  h1, h2, h3, .space-font { font-family: 'Space Grotesk', sans-serif; }

  /* TOOLBAR */
  .toolbar { display: flex; gap: 12px; justify-content: flex-end; margin-bottom: 15px; }
  .tool-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--text-muted); padding: 8px 16px; border-radius: 12px; cursor: pointer; font-family: 'Space Grotesk', sans-serif; font-size: 0.85rem; transition: all 0.3s ease; }
  .tool-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .tool-btn.active { color: var(--neon-blue); border-color: rgba(0, 240, 255, 0.4); background: rgba(0, 240, 255, 0.1); box-shadow: 0 0 15px rgba(0, 240, 255, 0.2); }

  .btn { padding: 16px 32px; border: none; border-radius: 16px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.1rem; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); text-transform: uppercase; letter-spacing: 1px; color:#fff; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);}
  .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.3); background: rgba(255,255,255,0.2); }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: #000; box-shadow: 0 0 20px rgba(0, 242, 254, 0.4); border:none;}
  .btn-primary:hover { background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); }

  /* LANDING */
  .landing { text-align: center; animation: fadeIn 0.8s ease-out; flex: 1; display: flex; flex-direction: column; justify-content: center; align-items:center;}
  .landing h1 { font-size: 3.5rem; font-weight: 900; margin-bottom: 10px; background: linear-gradient(to right, var(--neon-blue), var(--neon-pink), var(--neon-yellow)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.3)); line-height: 1.2;}
  .landing p.sub { font-size: 1.2rem; color: var(--text-muted); margin-bottom: 30px; }
  .mode-select { display: flex; gap: 20px; justify-content: center; margin: 20px 0; flex-wrap: wrap; width:100%;}
  .card-mode { flex: 1; min-width: 250px; padding: 30px; cursor: pointer; border: 2px solid rgba(255,255,255,0.1); border-radius: 20px; text-align: center; transition: all 0.3s; background: rgba(0,0,0,0.4); }
  .card-mode:hover { border-color: var(--neon-blue); background: rgba(0, 240, 255, 0.05); transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0, 240, 255, 0.1); }
  .team-count { display: flex; gap: 16px; justify-content: center; margin: 30px 0; }
  .team-count button { width: 60px; height: 60px; border-radius: 16px; border: 2px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: #fff; font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; cursor: pointer; transition: all 0.3s; }
  .team-count button:hover { border-color: var(--neon-blue); transform: translateY(-2px); }
  .team-count button.sel { background: var(--neon-blue); color: #000; border-color: var(--neon-blue); box-shadow: 0 0 20px rgba(0, 240, 255, 0.4); }
  .t-row { display: flex; align-items: center; gap: 16px; background: rgba(0,0,0,0.3); padding: 8px 16px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); margin-bottom:16px;}
  .t-row input { flex: 1; background: transparent; border: none; color: #fff; font-family: 'Outfit', sans-serif; font-size: 1.2rem; padding: 8px 0; outline: none; }

  /* INSTRUCTIONS */
  .instructions-box { text-align: left; max-width: 800px; margin: 0 auto; width: 100%;}
  .inst-list { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
  .inst-list li { display: flex; align-items: flex-start; gap: 15px; font-size: 1rem; line-height: 1.4; background: rgba(0,0,0,0.4); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
  @media(max-width: 700px){ .inst-list{grid-template-columns: 1fr;} }

  /* TRACK UI */
  .track-container { padding: 20px; margin-bottom: 20px; position: relative; overflow: hidden; }
  .lane { display: flex; align-items: center; gap: 15px; margin-bottom: 12px; position: relative; z-index: 2; }
  .lane-name { width: 90px; text-align: right; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 0.9rem; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-line { flex: 1; height: 12px; background: rgba(0,0,0,0.5); border-radius: 10px; position: relative; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.05); }
  .track-fill { position: absolute; top: 0; left: 0; height: 100%; border-radius: 10px; transition: width 1s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: 0 0 10px currentColor; }
  .ship-avatar { position: absolute; top: 50%; left: -20px; transform: translateY(-50%); font-size: 2rem; transition: left 1s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.3s; filter: drop-shadow(0 0 10px rgba(255,255,255,0.5)); z-index: 10; }
  .lane.active .ship-avatar { animation: hoverShip 2s infinite ease-in-out; filter: drop-shadow(0 0 20px currentColor); }
  .score-badge { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.5); border-radius: 12px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; border: 1px solid rgba(255,255,255,0.1); }
  
  @keyframes hoverShip { 0%, 100% { transform: translateY(-50%) scale(1.2); } 50% { transform: translateY(-60%) scale(1.2); } }
  .floating-point { position: absolute; font-family: 'Space Grotesk', sans-serif; font-weight: 900; font-size: 1.5rem; pointer-events: none; animation: floatUp 2s ease-out forwards; z-index: 100; white-space: nowrap; text-shadow: 0 0 10px #000; }
  @keyframes floatUp { 0% { opacity: 0; transform: translateY(0) scale(0.5); } 15% { opacity: 1; transform: translateY(-20px) scale(1.2); } 80% { opacity: 1; transform: translateY(-40px) scale(1); } 100% { opacity: 0; transform: translateY(-60px) scale(0.8); } }

  /* HUD & LIFELINES */
  .hud { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; margin-bottom: 20px; border-top: 1px solid rgba(255,255,255,0.05); background: linear-gradient(90deg, rgba(255,255,255,0.05), transparent); flex-wrap: wrap; gap: 15px; }
  .hud-turn { display: flex; align-items: center; gap: 12px; }
  .hud-turn .value { font-family: 'Space Grotesk', sans-serif; font-size: 1.4rem; font-weight: 700; }
  
  .lifelines { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;}
  .ll-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 6px 10px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 0.8rem; color: #fff; cursor: pointer; transition: all 0.3s; }
  .ll-btn:hover:not(.used):not(.jammed) { transform: translateY(-2px); box-shadow: 0 0 10px currentColor; }
  .ll-btn.used { opacity: 0.3; cursor: not-allowed; filter: grayscale(100%); text-decoration: line-through; }
  .ll-btn.jammed { opacity: 0.5; border-color: red; color: red; cursor: not-allowed; animation: shakeAnim 2s infinite; }
  .ll-sabotage { color: var(--neon-pink); border-color: var(--neon-pink); }
  .ll-wager { color: var(--neon-orange); border-color: var(--neon-orange); }

  .hud-timer { font-family: 'Space Grotesk', sans-serif; font-size: 2.5rem; font-weight: 900; color: var(--neon-blue); text-shadow: 0 0 15px rgba(0, 240, 255, 0.4); }
  .hud-timer.danger { color: var(--neon-pink); text-shadow: 0 0 15px rgba(255, 0, 127, 0.6); animation: pulseTimer 0.5s infinite; }
  .hud-timer.bonus { color: var(--neon-green); text-shadow: 0 0 15px rgba(0, 255, 102, 0.6); }

  /* QUESTIONS & SABOTAGE GLITCH */
  .q-container { padding: 30px; position: relative; overflow: hidden; transition: all 0.3s; }
  .fade-in-quick { animation: fadeInQuick 0.4s ease-out; }
  .glitched { animation: glitch-anim 0.2s linear infinite, rgb-shift 2s infinite alternate; filter: blur(3px) contrast(150%) brightness(120%); pointer-events: none; }
  @keyframes glitch-anim { 0% { transform: translate(0) skew(0deg); } 20% { transform: translate(-5px, 5px) skew(5deg); } 40% { transform: translate(-5px, -5px) skew(-5deg); } 60% { transform: translate(5px, 5px) skew(2deg); } 80% { transform: translate(5px, -5px) skew(-2deg); } 100% { transform: translate(0) skew(0deg); } }
  @keyframes rgb-shift { 0% { filter: hue-rotate(0deg) blur(2px) contrast(150%); } 100% { filter: hue-rotate(90deg) blur(3px) contrast(200%); } }

  .q-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .q-category { display: inline-block; padding: 6px 16px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
  .q-text { font-size: 1.3rem; line-height: 1.5; font-weight: 500; margin-bottom: 30px; }

  .opts-grid { display: grid; gap: 16px; }
  .opt-btn { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); padding: 18px 24px; border-radius: 16px; color: var(--text-main); font-family: 'Outfit', sans-serif; font-size: 1.05rem; text-align: left; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 15px; }
  .opt-btn.hidden { display: none; } 
  .opt-btn::before { content: ''; display: block; width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); flex-shrink: 0; transition: all 0.2s; }
  .opt-btn:hover:not(.locked) { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.3); transform: translateX(5px); }
  .opt-btn:hover:not(.locked)::before { border-color: var(--neon-blue); box-shadow: 0 0 10px var(--neon-blue); }
  .opt-btn.locked { cursor: default; opacity: 0.6; }
  .opt-btn.reveal { border-color: var(--neon-green); background: rgba(0, 255, 102, 0.05); opacity: 1; }
  .opt-btn.reveal::before { background: var(--neon-green); border-color: var(--neon-green); box-shadow: 0 0 15px var(--neon-green); }
  .opt-btn.wrong-pick { border-color: var(--neon-pink); background: rgba(255, 0, 127, 0.05); opacity: 1; }
  .opt-btn.wrong-pick::before { background: var(--neon-pink); border-color: var(--neon-pink); box-shadow: 0 0 15px var(--neon-pink); }

  .terminal-box { background: #02040a; border: 1px solid #1e293b; border-radius: 16px; padding: 25px; font-family: 'Space Grotesk', monospace; position: relative; overflow: hidden; }
  .terminal-box::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, var(--neon-green), transparent); opacity: 0.5; }
  .calc-input-wrapper { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
  .calc-input { flex: 1; background: transparent; border: none; border-bottom: 2px solid rgba(0, 255, 102, 0.3); color: var(--neon-green); font-size: 2rem; font-family: 'Space Grotesk', monospace; padding: 10px 0; outline: none; transition: border-color 0.3s; }
  
  .match-cols { display: flex; gap: 20px; width: 100%; }
  .match-col { flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .match-btn { padding: 15px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: var(--text-main); font-family: 'Outfit', sans-serif; cursor: pointer; transition: all 0.2s; text-align: left; }
  .match-btn.selected { background: rgba(0, 240, 255, 0.1); border-color: var(--neon-blue); box-shadow: 0 0 15px rgba(0, 240, 255, 0.3); transform: scale(1.02); }
  .match-btn.locked { opacity: 0.6; pointer-events: none; }

  /* OVERLAYS & EVENTS */
  .event-banner { font-family: 'Space Grotesk', sans-serif; font-weight: 900; font-size: 1.1rem; text-transform: uppercase; text-align: center; padding: 12px; border-radius: 12px; margin-bottom: 20px; animation: pulseEvent 1.5s infinite; letter-spacing: 1px; }
  @keyframes pulseEvent { 0%, 100% { box-shadow: inset 0 0 10px currentColor; } 50% { box-shadow: inset 0 0 30px currentColor; } }
  .event-risk { background: rgba(255, 69, 0, 0.15); border: 2px solid var(--neon-orange); color: var(--neon-orange); text-shadow: 0 0 10px var(--neon-orange); }
  .event-speed { background: rgba(255, 0, 255, 0.15); border: 2px solid #ff00ff; color: #ff00ff; text-shadow: 0 0 10px #ff00ff; }
  .event-jammed { background: rgba(255, 0, 127, 0.15); border: 2px solid var(--neon-pink); color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink); }
  .wager-active-ban { background: rgba(0, 240, 255, 0.15); border: 2px solid var(--neon-blue); color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); }

  .modal-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; animation: fadeIn 0.2s; }
  .modal-box { background: var(--glass-bg); border: 1px solid var(--neon-blue); border-radius: 20px; padding: 30px; text-align: center; max-width: 400px; width: 90%; box-shadow: 0 0 30px rgba(0, 240, 255, 0.2); }
  .modal-box .opt-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .modal-box button { padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.5); color: #fff; font-family: 'Outfit', sans-serif; cursor: pointer; font-size: 1.1rem; }
  .modal-box button:hover { background: rgba(255,255,255,0.1); border-color: var(--neon-blue); }

  .feedback-box { margin-top: 25px; padding: 20px; border-radius: 16px; animation: fadeIn 0.4s; display: flex; flex-direction: column; gap: 10px; }
  .feedback-box.success { background: rgba(0, 255, 102, 0.1); border: 1px solid rgba(0, 255, 102, 0.2); color: var(--neon-green);}
  .feedback-box.error { background: rgba(255, 0, 127, 0.1); border: 1px solid rgba(255, 0, 127, 0.2); color: var(--neon-pink);}

  /* WINNER */
  .winner-screen { text-align: center; padding: 60px 20px; flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; animation: zoomIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); }
  @keyframes zoomIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
  .trophy { font-size: 6rem; filter: drop-shadow(0 0 30px var(--neon-yellow)); margin-bottom: 20px; animation: floatTrophy 3s ease-in-out infinite; }
  @keyframes floatTrophy { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
  .podium-grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin: 40px 0; width: 100%; max-width: 700px; }
  .podium-card { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 25px; flex: 1; min-width: 150px; position: relative; overflow: hidden; }
  .podium-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: currentColor; }

  .shake { animation: shakeAnim 0.4s cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes shakeAnim { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-6px, 0, 0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>

<canvas id="starfield"></canvas>
<canvas id="confetti"></canvas>
<div class="nebula nebula-1"></div>
<div class="nebula nebula-2"></div>
<div id="app"></div>

<script>
// ============================================================
//  VISUAL & AUDIO ENGINE
// ============================================================
const cvs = document.getElementById('starfield');
const ctx = cvs.getContext('2d');
let stars = []; let hyperSpeed = false;

function initStars() {
  cvs.width = window.innerWidth; cvs.height = window.innerHeight; stars = [];
  for (let i = 0; i < 150; i++) { stars.push({ x: Math.random()*cvs.width, y: Math.random()*cvs.height, z: Math.random()*2+0.1, r: Math.random()*1.5+0.5, alpha: Math.random() }); }
}
function drawStars() {
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  let speedMult = hyperSpeed ? 8 : 1.5; 
  for (let s of stars) {
    s.y += (1 / s.z) * speedMult; s.alpha += 0.02;
    if (s.y > cvs.height) { s.y = 0; s.x = Math.random() * cvs.width; }
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255, 255, 255, ${0.3 + Math.abs(Math.sin(s.alpha))*0.7})`; ctx.fill();
  }
  requestAnimationFrame(drawStars);
}
window.addEventListener('resize', initStars); initStars(); drawStars();

const confCvs = document.getElementById('confetti');
const confCtx = confCvs.getContext('2d');
let confParticles = []; let confActive = false;
const confColors = ['#00f0ff', '#ff007f', '#00ff66', '#ffde00', '#ffffff'];

function launchConfetti() {
  confCvs.width = window.innerWidth; confCvs.height = window.innerHeight;
  confParticles = []; confActive = true;
  for(let i=0; i<150; i++) {
    confParticles.push({
      x: Math.random() * confCvs.width, y: Math.random() * confCvs.height - confCvs.height,
      r: Math.random() * 6 + 2, d: Math.random() * 20 + 10,
      color: confColors[Math.floor(Math.random() * confColors.length)],
      tilt: Math.floor(Math.random() * 10) - 10,
      tiltAngleInc: (Math.random() * 0.07) + 0.05, tiltAngle: 0
    });
  }
  requestAnimationFrame(drawConfetti);
}
function drawConfetti() {
  if(!confActive) { confCtx.clearRect(0,0,confCvs.width, confCvs.height); return; }
  confCtx.clearRect(0,0,confCvs.width, confCvs.height);
  for(let i=0; i<confParticles.length; i++) {
    let p = confParticles[i];
    p.tiltAngle += p.tiltAngleInc; p.y += (Math.cos(p.d) + 3 + p.r/2) / 2; p.x += Math.sin(p.d);
    p.tilt = Math.sin(p.tiltAngle) * 15;
    if(p.y > confCvs.height) { p.x = Math.random() * confCvs.width; p.y = -20; }
    confCtx.beginPath(); confCtx.lineWidth = p.r; confCtx.strokeStyle = p.color;
    confCtx.moveTo(p.x + p.tilt + p.r, p.y); confCtx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r); confCtx.stroke();
  }
  requestAnimationFrame(drawConfetti);
}

let audioCtx=null, sfxGain=null, musicOn=true, sfxOn=true, musicInterval=null;
function initAudio(){
  if(audioCtx) return; 
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if(AudioContext) {
      audioCtx = new AudioContext();
      sfxGain = audioCtx.createGain(); sfxGain.gain.value = 0.3; sfxGain.connect(audioCtx.destination);
    }
  } catch(e) {}
}
function playTone(freq, type, dur, delay=0, vol=1){
  if(!audioCtx||!sfxOn)return;
  try {
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type; o.frequency.value=freq; g.gain.setValueAtTime(vol, audioCtx.currentTime+delay);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+delay+dur);
    o.connect(g); g.connect(sfxGain); o.start(audioCtx.currentTime+delay); o.stop(audioCtx.currentTime+delay+dur);
  } catch(e){}
}
function sfxClick(){ playTone(800, 'sine', 0.05, 0, 0.5); }
function sfxCorrect(){ playTone(600, 'square', 0.1); playTone(800, 'square', 0.15, 0.1); playTone(1200, 'sine', 0.2, 0.25); }

const MUSIC_NOTES = [220, 261, 329, 440, 329, 261];
let mStep = 0;
function toggleMusic() { 
  initAudio(); musicOn = !musicOn; 
  if(musicOn && G.screen==='game') {
    if(musicInterval) clearInterval(musicInterval);
    musicInterval = setInterval(()=>{ playTone(MUSIC_NOTES[mStep%MUSIC_NOTES.length], 'triangle', 0.4, 0, 0.3); mStep++; }, 400);
  } else { clearInterval(musicInterval); musicInterval = null; }
  renderToolbarOnly(); 
}

function shuffle(arr){ const b=[...arr]; for(let i=b.length-1; i>0; i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }

  screen: 'select_mode', mode: 'multi', teams: [], scores: [], turn: 0, qs: [], qIndex: 0,

};

// ============================================================
//  RENDERIZADO PRINCIPAL
// ============================================================
function render() {
  if (G.screen === 'select_mode') renderModeSelect();
  else if (G.screen === 'setup_multi') renderMultiSetup();
  else if (G.screen === 'instructions') renderInstructions();
  else if (G.screen === 'game') { renderGame(); if(!G.answered && G.timer === 0 && !document.querySelector('.modal-overlay')) startTurn(); }
  else if (G.screen === 'winner') renderWinner();
}

function renderToolbarHTML() {
  return `
    <div class="toolbar">
      <button class="tool-btn ${musicOn?'active':''}" onclick="toggleMusic()">🎵 Música</button>
      <button class="tool-btn ${sfxOn?'active':''}" onclick="sfxOn=!sfxOn;renderToolbarOnly();sfxClick()">🔊 SFX</button>
      ${G.screen==='game' ? `<button class="tool-btn" onclick="abortGame()" style="color:var(--neon-pink);border-color:var(--neon-pink)">■ Salir</button>` : ''}
    </div>
  `;
}
function renderToolbarOnly() { const t = document.getElementById('toolbar-wrapper'); if(t) t.innerHTML = renderToolbarHTML(); }

function abortGame() { clearTimeout(G.iaTimeout); clearInterval(timerInt); document.body.classList.remove('danger-mode'); hyperSpeed=false; G.screen = 'select_mode'; render(); }

      { name: 'Humano', ship: '🚀', color: COLORS[0], lifelines: { fifty: true, time: true, skip: true, wager: true, sabotage: true }, isIA: false, isSabotaged: false },
      { name: 'Comandante IA', ship: '🛸', color: COLORS[1], lifelines: { fifty: false, time: false, skip: false, wager: false, sabotage: false }, isIA: true, isSabotaged: false }
    ];
    G.screen = 'instructions';
  } else { G.teams = []; G.screen = 'setup_multi'; }
  render();
}

function startGame() {
  initAudio(); G.scores = G.teams.map(()=>0); G.qs = shuffle(QUESTIONS); // Revolver las 50 preguntas

// --- PANTALLA JUEGO ---
function renderGame() {
  if (!document.getElementById('game-layout')) {
    app.innerHTML = `<div id="game-layout" style="width:100%;"><div id="toolbar-wrapper"></div><div class="glass-panel track-container" id="track-container"></div><div class="glass-panel hud" id="hud-container"></div><div id="event-container"></div><div class="glass-panel q-container" id="q-container"></div></div><div id="modal-container"></div>`;
    let trackHTML = '';
    G.teams.forEach((team, i) => { trackHTML += `<div class="lane" id="lane-${i}"><div class="lane-name" style="color:${team.color}">${team.name}</div><div class="track-line"><div class="track-fill" id="fill-${i}" style="width:0%; background:${team.color}; box-shadow: 0 0 15px ${team.color}"></div><div class="ship-avatar" id="ship-${i}" style="left: calc(0% - 20px)">${team.ship}</div></div><div class="score-badge" id="score-${i}" style="color:${team.color}; border-color:${team.color}">0</div></div>`; });
    document.getElementById('track-container').innerHTML = trackHTML;
  }

  renderToolbarOnly();

  // Track Update
  G.teams.forEach((team, i) => {
    const progress = Math.min((G.scores[i] / GOAL) * 100, 100);
    document.getElementById(`lane-${i}`).className = `lane ${G.turn === i ? 'active' : ''}`;
    document.getElementById(`fill-${i}`).style.width = `${progress}%`;
    document.getElementById(`ship-${i}`).style.left = `calc(${progress}% - 20px)`;
    document.getElementById(`score-${i}`).innerText = G.scores[i];
  });

  const t = G.teams[G.turn];
  const isJammed = G.currentEvent === 'JAMMED';
  
  let llHtml = '';
  if(!t.isIA) {
    llHtml += `<button class="ll-btn ${t.lifelines.fifty ? (isJammed?'jammed':'') : 'used'}" onclick="useLifeline('fifty')">50/50</button>`;
    llHtml += `<button class="ll-btn ${t.lifelines.time ? (isJammed?'jammed':'') : 'used'}" onclick="useLifeline('time')">+15s</button>`;
    llHtml += `<button class="ll-btn ${t.lifelines.skip ? (isJammed?'jammed':'') : 'used'}" onclick="useLifeline('skip')">↻</button>`;
    if(G.activeWager === 0 && !G.answered) { llHtml += `<button class="ll-btn btn-pro" style="color:black; padding:8px 15px; margin-left:10px; font-size:0.8rem; background:var(--neon-orange); border:none;" onclick="triggerWagerUI()" ${t.lifelines.wager&&!isJammed?'':'disabled'}>🚀 APUESTA</button>`; }
    llHtml += `<button class="ll-btn btn-pro" style="color:black; padding:8px 15px; margin-left:10px; font-size:0.8rem; background:var(--neon-pink); border:none;" onclick="triggerSabotageUI()" ${t.lifelines.sabotage&&!isJammed?'':'disabled'}>💣 PEM</button>`;
  }

  document.getElementById('hud-container').innerHTML = `<div class="hud-turn"><span style="font-size:2rem; filter:drop-shadow(0 0 10px ${t.color})">${t.ship}</span><div><div class="label" style="color:var(--text-muted);font-size:0.8rem">Turno de</div><div class="value" style="color:${t.color};font-size:1.4rem;font-weight:bold">${t.name}</div></div></div><div class="lifelines">${llHtml}</div><div class="hud-timer ${G.timer<=5 && !G.answered ? 'danger':''}" id="main-timer">00:${G.timer.toString().padStart(2,'0')}</div>`;

  let evHtml = '';
  if (G.currentEvent === 'RISK') evHtml = `<div style="text-align:center; padding:10px; background:rgba(255,69,0,0.2); color:var(--neon-orange); font-weight:bold; margin-bottom:15px; border-radius:10px; border:2px solid var(--neon-orange); animation: pulseEvent 1s infinite">⚠️ EVENTO RIESGO: Puntos x2 | Fallo = -4 Pts</div>`;
  else if (G.currentEvent === 'SPEED') evHtml = `<div style="text-align:center; padding:10px; background:rgba(255,0,255,0.2); color:#ff00ff; font-weight:bold; margin-bottom:15px; border-radius:10px; border:2px solid #ff00ff">⚡ EVENTO VELOCIDAD: 15 segundos max</div>`;
  else if (G.currentEvent === 'JAMMED') evHtml = `<div style="text-align:center; padding:10px; background:rgba(255,0,127,0.2); color:var(--neon-pink); font-weight:bold; margin-bottom:15px; border-radius:10px; border:2px solid var(--neon-pink)">🚫 EVENTO INTERFERENCIA: Sin Comodines</div>`;
  if (G.activeWager > 0) evHtml += `<div style="text-align:center; padding:10px; background:rgba(0,240,255,0.2); color:var(--neon-blue); font-weight:bold; margin-bottom:15px; border-radius:10px; border:2px solid var(--neon-blue)">🚀 HIPERIMPULSOR: Apuesta de ${G.activeWager} Puntos en Riesgo</div>`;
  document.getElementById('event-container').innerHTML = evHtml;

  if (G.currentEvent === 'RISK') document.body.classList.add('danger-mode'); else document.body.classList.remove('danger-mode');

  const qContainer = document.getElementById('q-container');
  const q = G.qs[G.qIndex];
  let isGlitching = t.isSabotaged && G.timer > (G.initialTimer - 8) && !G.answered;

  if (G.lastRenderedQ !== G.qIndex) {
    qContainer.className = 'glass-panel q-container fade-in-quick'; void qContainer.offsetWidth; G.lastRenderedQ = G.qIndex;
    if(q.type === 'match') G.matchData = { terms: q.pairs.map((p, i) => ({ id: i, text: p.t })), descs: shuffle(q.pairs.map((p, i) => ({ id: i, text: p.d }))), tentativePairs: [], selectedTermId: null };
    if(t.isSabotaged) sfxGlitch();
  }

  if (isGlitching) qContainer.classList.add('glitched'); else qContainer.classList.remove('glitched');

  let qHTML = `<div style="display:flex; justify-content:space-between; margin-bottom:20px"><span style="background:${CAT_COLORS[q.cat]}44; color:${CAT_COLORS[q.cat]}; padding:5px 15px; border-radius:20px; font-weight:bold">${q.cat}</span><span style="color:var(--text-muted)">Meta: ${GOAL} pts (P. ${G.qIndex+1}/${G.qs.length})</span></div><h2 style="font-size:1.4rem; margin-bottom:25px">${q.q}</h2>`;

  if (q.type === 'choice') {
    qHTML += `<div style="display:grid; gap:15px">`;
    q.opts.forEach((opt, i) => {
      let cls = 'btn';
      if(G.hiddenOpts.includes(i)) cls += ' hidden'; 
      if(G.answered) {
        cls += ' locked';
        if(i === q.ans) { cls += ' btn-success'; }
        else if(G.picked === i) { cls += ' btn-primary'; }
      }
      qHTML += `<button class="${cls}" style="text-align:left; font-size:1rem; text-transform:none; padding:15px; ${G.answered?'opacity:0.7':''}" onclick="pickAnswer(${i})">${opt}</button>`;
    });
    qHTML += `</div>`;
  } 
  else if (q.type === 'calc') {
    qHTML += `<div class="terminal-box"><div class="calc-input-wrapper"><span>></span><input type="number" class="calc-input" id="terminal-input" placeholder="INGRESA VALOR..." value="${G.calcVal}" oninput="G.calcVal=this.value" ${G.answered ? 'disabled' : ''} onkeydown="if(event.key==='Enter')checkMath()"></div>${!G.answered ? `<button class="btn btn-primary w-100" onclick="checkMath()">EJECUTAR CÁLCULO</button>` : ''}</div>`;
  } 
  else if (q.type === 'match') {
    qHTML += `<div style="color:var(--neon-yellow); text-align:center; margin-bottom:15px; font-weight:bold">Conecta conceptos y definiciones. (Error resta tiempo)</div><div id="match-ui-container"></div>`;
  }

  if (t.isIA && !G.answered) { qHTML += `<div style="position:absolute; inset:0; background:rgba(0,0,0,0.8); display:flex; align-items:center; justify-content:center; flex-direction:column; border-radius:24px; z-index:50;"><h2 style="color:var(--neon-blue); animation:pulseEvent 1s infinite">🤖 IA CALCULANDO...</h2></div>`; }

  if (G.answered) {
    let isCorrect = false;
    if(q.type === 'choice') isCorrect = (G.picked === q.ans);
    else if(q.type === 'calc') isCorrect = (G.calcVal === q.ans);
    else if(q.type === 'match') isCorrect = G.matchData.tentativePairs.length === q.pairs.length;
    if (t.isIA && G.picked === q.ans) isCorrect = true;

    qHTML += `<div class="feedback-box ${isCorrect?'success':'error'}" style="margin-top:20px; padding:20px; border-radius:15px; text-align:center; background: ${isCorrect?'rgba(0,255,102,0.1)':'rgba(255,0,127,0.1)'}"><h3 style="color:${isCorrect?'var(--neon-green)':'var(--neon-pink)'}">${isCorrect ? '✓ ACCESO CONCEDIDO' : '✗ ERROR DEL SISTEMA'}</h3><p style="margin-top:10px">${t.isIA ? 'IA finalizó turno.' : q.fb}</p></div><div style="text-align:right; margin-top:20px"><button class="btn btn-primary" onclick="sfxClick();nextTurn()">SIGUIENTE TURNO ➔</button></div>`;
  }

  qContainer.innerHTML = qHTML;
  if (!t.isIA && q.type === 'calc' && !G.answered && !isGlitching) { setTimeout(()=> { const input = document.getElementById('terminal-input'); if (input) input.focus(); }, 100); } 
  else if (!t.isIA && q.type === 'match') { renderMatchUI(); }
}

// --- MODALS PVP (NERFEADO A MAX 3 PUNTOS) ---
function triggerWagerUI() {
  if(G.answered || G.currentEvent === 'JAMMED' || !G.teams[G.turn].lifelines.wager) return;
  const maxWager = Math.min(3, G.scores[G.turn]); // ¡NERF APLICADO! MAXIMO 3 PUNTOS
  if(maxWager <= 0) { alert("¡Necesitas al menos 1 punto para activar el Hiperimpulsor!"); return; }
  clearInterval(timerInt); sfxPowerup();
  
  const m = document.getElementById('modal-container');
  m.innerHTML = `<div class="modal-overlay"><div class="glass-panel" style="border-color:var(--neon-orange); text-align:center; max-width:400px"><h2 style="color:var(--neon-orange); margin-bottom:15px">🚀 HIPERIMPULSOR</h2><p style="margin-bottom:20px; color:var(--text-muted)">Apuesta a ciegas antes de responder. Acierta y gana el doble. Falla y piérdelos. (Máximo de seguridad: 3 puntos)</p><div style="display:flex; flex-direction:column; gap:10px; margin-bottom:20px">${Array.from({length: maxWager}, (_, i) => `<button class="btn" style="border-color:var(--neon-orange); color:var(--neon-orange)" onclick="confirmWager(${i+1})">Apostar ${i+1} Pts</button>`).join('')}</div><button class="btn w-100" onclick="cancelModal()">Abortar Activación</button></div></div>`;
}
function confirmWager(pts) { G.activeWager = pts; G.teams[G.turn].lifelines.wager = false; hyperSpeed = true; document.getElementById('modal-container').innerHTML = ''; sfxHyper(); resumeTimerLoop(); render(); }

function triggerSabotageUI() {
  if(G.answered || G.currentEvent === 'JAMMED' || !G.teams[G.turn].lifelines.sabotage) return;
  clearInterval(timerInt); sfxPowerup();
  const m = document.getElementById('modal-container');
  let targets = G.teams.map((t,i) => i !== G.turn && !t.isSabotaged && !t.isIA ? `<button class="btn" onclick="confirmSabotage(${i})" style="color:${t.color}; border-color:${t.color}">${t.ship} ${t.name}</button>` : '').join('');
  if(!targets) targets = "<p>No hay objetivos válidos para sabotear en este momento.</p>";
  m.innerHTML = `<div class="modal-overlay"><div class="glass-panel" style="border-color:var(--neon-pink); text-align:center; max-width:400px"><h2 style="color:var(--neon-pink); margin-bottom:15px">💣 RAYO PEM</h2><p style="margin-bottom:20px">Selecciona rival para sabotear su pantalla con un Glitch visual durante los primeros 8 segundos de su turno.</p><div style="display:flex; flex-direction:column; gap:10px; margin-bottom:20px">${targets}</div><button class="btn w-100" onclick="cancelModal()">Cancelar</button></div></div>`;
}
function confirmSabotage(idx) { G.teams[idx].isSabotaged = true; G.teams[G.turn].lifelines.sabotage = false; document.getElementById('modal-container').innerHTML = ''; sfxGlitch(); resumeTimerLoop(); render(); }
function cancelModal() { document.getElementById('modal-container').innerHTML = ''; resumeTimerLoop(); render(); }

// --- LIFELINES COMUNES ---
function useLifeline(type) {
  if(G.answered || G.teams[G.turn].isIA || G.currentEvent === 'JAMMED' || !G.teams[G.turn].lifelines[type]) return;
  const q = G.qs[G.qIndex];
  if (type === 'fifty') {
    if(q.type !== 'choice') { alert("El comodín 50/50 solo sirve en selección múltiple."); return; }
    sfxPowerup(); let w = []; q.opts.forEach((o, i) => { if(i !== q.ans) w.push(i); });
    w = shuffle(w); G.hiddenOpts = w.slice(0, Math.max(1, w.length - 1));
    G.teams[G.turn].lifelines.fifty = false; render(); 
  } 
  else if (type === 'time') {
    sfxPowerup(); G.timer += 15; G.teams[G.turn].lifelines.time = false;
    const t = document.getElementById('main-timer'); if(t) { t.innerText = `00:${G.timer.toString().padStart(2,'0')}`; t.style.color = 'var(--neon-green)'; setTimeout(()=> t.style.color = '', 500); }
    render();
  }
  else if (type === 'skip') {
    sfxPowerup(); G.teams[G.turn].lifelines.skip = false; G.qIndex++;
    if(G.qIndex >= G.qs.length) { G.qs = shuffle(QUESTIONS); G.qIndex = 0; }
    G.lastRenderedQ = -1; G.hiddenOpts = []; startTurn(); render();
  }
}

// --- MATCH UI ---
function renderMatchUI() {
  const c = document.getElementById('match-ui-container'); if(!c) return;
  const md = G.matchData; let h = `<div style="display:flex; gap:20px; flex-direction:column; width:100%"><div style="display:flex; gap:20px; width:100%"><div style="flex:1; display:flex; flex-direction:column; gap:10px;">`;
  
  md.terms.forEach(t => {
    const pair = md.tentativePairs.find(p => p.termId === t.id); const isSel = md.selectedTermId === t.id;
    let cls = 'btn'; let st = 'padding:12px; font-size:0.9rem; text-transform:none; text-align:left; background:rgba(0,0,0,0.5);';
    if(pair) { st += `border-color:${MATCH_COLORS[pair.colorIndex]}; color:${MATCH_COLORS[pair.colorIndex]}; box-shadow:inset 0 0 10px ${MATCH_COLORS[pair.colorIndex]}44;`; }
    if(isSel) { st += `border-color:var(--neon-blue); box-shadow:0 0 15px rgba(0,240,255,0.4); transform:scale(1.02);`; }
    if(G.answered && !pair) st += 'opacity:0.5; pointer-events:none;';
    h += `<button class="${cls}" style="${st}" onclick="clickTerm(${t.id})">${t.text}</button>`;
  });
  h += `</div><div style="flex:1; display:flex; flex-direction:column; gap:10px;">`;
  
  md.descs.forEach(d => {
    const pair = md.tentativePairs.find(p => p.descId === d.id);
    let cls = 'btn'; let st = 'padding:12px; font-size:0.9rem; text-transform:none; text-align:left; background:rgba(0,0,0,0.5);';
    if(pair) { st += `border-color:${MATCH_COLORS[pair.colorIndex]}; color:${MATCH_COLORS[pair.colorIndex]}; box-shadow:inset 0 0 10px ${MATCH_COLORS[pair.colorIndex]}44;`; }
    if(G.answered && !pair) st += 'opacity:0.5; pointer-events:none;';
    h += `<button class="${cls}" style="${st}" onclick="clickDesc(${d.id})">${d.text}</button>`;
  });
  h += `</div></div></div>`;

  if (!G.answered && md.tentativePairs.length === G.qs[G.qIndex].pairs.length) { h += `<div style="text-align:center; margin-top:20px;"><button class="btn btn-primary" onclick="verifyMatchConnections()">🔍 COMPROBAR</button></div>`; }
  c.innerHTML = h;
}

function clickTerm(id) {
  if(G.answered || G.teams[G.turn].isIA) return; sfxClick();
  const md = G.matchData; const ex = md.tentativePairs.findIndex(p => p.termId === id);
  if (ex !== -1) { md.tentativePairs.splice(ex, 1); md.selectedTermId = null; renderMatchUI(); return; }
  md.selectedTermId = id; renderMatchUI();
}

function clickDesc(descId) {
  if(G.answered || G.teams[G.turn].isIA) return; sfxClick();
  const md = G.matchData; const ex = md.tentativePairs.findIndex(p => p.descId === descId);
  if (ex !== -1) { md.tentativePairs.splice(ex, 1); renderMatchUI(); return; }
  if (md.selectedTermId !== null) {
    let colorIndex = md.tentativePairs.length % MATCH_COLORS.length;
    md.tentativePairs.push({ termId: md.selectedTermId, descId: descId, colorIndex: colorIndex });
    md.selectedTermId = null; renderMatchUI();
  }
}

function verifyMatchConnections() {
  if (G.answered || G.teams[G.turn].isIA) return;
  const md = G.matchData; let isAllCorrect = true;
  md.tentativePairs.forEach(p => { if (p.termId !== p.descId) isAllCorrect = false; });

  if (isAllCorrect) {
    clearInterval(timerInt); G.answered = true; processCorrect(); render(); checkGoal();
  } else {
    sfxWrong(); triggerShake();
    if(G.currentEvent === 'RISK') { applyPenalty(); G.answered = true; render(); checkGoal(); } 
    else {
      G.timer = Math.max(1, G.timer - 5); md.tentativePairs = []; md.selectedTermId = null; renderMatchUI();
      const tDOM = document.getElementById('main-timer');
      if(tDOM) { tDOM.innerText = `00:${G.timer.toString().padStart(2,'0')}`; tDOM.style.color = 'var(--neon-pink)'; setTimeout(()=> tDOM.style.color = '', 500); }
    }
  }
}

function triggerShake() { const el = document.getElementById('q-container'); if(!el) return; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

// --- CORE GAME LOOP & TIMER ---
function applyPenalty() {
  let p = 0; 
  if(G.currentEvent === 'RISK') p += 4; // EVENTO RIESGO AHORA QUITA 4 PTS (MÁS LETAL)
  if(G.activeWager > 0) p += G.activeWager;
  if(p > 0) { G.scores[G.turn] = Math.max(0, G.scores[G.turn] - p); animateFloatPoints(-p, '(Fallo de Sistema)', 'var(--neon-pink)'); }
}

function resumeTimerLoop() {
  clearInterval(timerInt);
  const t = G.teams[G.turn];
  timerInt = setInterval(() => {
    G.timer--;
    if(G.timer <= 5 && G.timer > 0) sfxTick();
    if(t.isSabotaged && G.timer === (G.initialTimer - 8)) render(); // Quita el glitch
    if(G.timer <= 0) { clearInterval(timerInt); handleTimeout(); return; }
    
    const tDOM = document.getElementById('main-timer');
    if(tDOM) {
      tDOM.innerText = `00:${G.timer.toString().padStart(2,'0')}`;
      const isFast = G.timer >= (G.initialTimer * 0.5);
      if(G.timer <= 5 && !G.answered) { tDOM.classList.add('danger'); tDOM.classList.remove('bonus'); } 
      else if (isFast && !G.answered && !t.isIA) { tDOM.classList.add('bonus'); tDOM.classList.remove('danger'); } 
      else { tDOM.classList.remove('danger', 'bonus'); }
    }
  }, 1000);
}

function startTurn() {
  G.initialTimer = G.currentEvent === 'SPEED' ? 15 : 30; G.timer = G.initialTimer;
  clearTimeout(G.iaTimeout);
  resumeTimerLoop(); 
  const t = G.teams[G.turn];
  
  if (t.isIA) {
    let delay = Math.floor(Math.random() * 3000) + 3000;
    if(G.currentEvent === 'SPEED') delay = 2000; 
    if(t.isSabotaged) delay += 4000; 
    
    G.iaTimeout = setTimeout(() => {
      if(G.answered) return;
      clearInterval(timerInt); G.answered = true;
      if(Math.random() < 0.60) { // IA Hardcore pero puede fallar
        const q = G.qs[G.qIndex]; G.picked = q.ans; 
        if(q.type==='calc') G.calcVal = q.ans;
        processCorrectIA(); 
      } else { sfxWrong(); triggerShake(); applyPenalty(); }
      render(); checkGoal();
    }, delay);
  }
}

function handleTimeout() { G.answered = true; sfxWrong(); triggerShake(); applyPenalty(); render(); }

function processCorrect() {
  const isFast = G.timer >= (G.initialTimer * 0.5); 
  const basePts = G.currentEvent === 'RISK' ? 4 : 2;
  const speedPts = isFast ? (G.currentEvent === 'RISK' ? 2 : 1) : 0;
  const ptsEarned = basePts + speedPts + G.activeWager;
  
  G.scores[G.turn] += ptsEarned; sfxCorrect();
  let txt = isFast ? 'Bono Vel.' : ''; if(G.activeWager > 0) txt += ` +${G.activeWager} Apuesta`;
  animateFloatPoints(ptsEarned, txt);
}

function processCorrectIA() {
  const ptsEarned = G.currentEvent === 'RISK' ? 4 : 2; 
  G.scores[G.turn] += ptsEarned; sfxCorrect(); 
  animateFloatPoints(ptsEarned, '(Cálculo IA)');
}

function animateFloatPoints(pts, text, color = null) {
  const lane = document.getElementById(`lane-${G.turn}`);
  if (lane) {
    const f = document.createElement('div'); f.className = 'floating-point'; f.style.color = color || G.teams[G.turn].color; 
    f.innerHTML = `${pts > 0 ? '+':''}${pts} <span style="font-size:0.4em; display:block">${text}</span>`;
    f.style.left = '50%'; f.style.top = '-10px'; lane.appendChild(f);
    setTimeout(()=> f.remove(), 1800);
  }
}

function pickAnswer(i) {
  if(G.answered || G.teams[G.turn].isIA) return;
  clearInterval(timerInt); G.answered = true; G.picked = i;
  if(i === G.qs[G.qIndex].ans) processCorrect(); else { sfxWrong(); triggerShake(); applyPenalty(); }
  render(); checkGoal();
}

function checkMath() {
  if(G.answered || G.teams[G.turn].isIA || G.calcVal.trim()==='') return;
  clearInterval(timerInt); G.answered = true;
  if(G.calcVal.trim() === G.qs[G.qIndex].ans) processCorrect(); else { sfxWrong(); triggerShake(); applyPenalty(); }
  render(); checkGoal();
}

function nextTurn() {
  G.teams[G.turn].isSabotaged = false; hyperSpeed = false; G.activeWager = 0;
  G.qIndex++; G.turn = (G.turn + 1) % G.teams.length;
  G.answered = false; G.picked = -1; G.calcVal = ''; G.hiddenOpts = [];
  
  // Si se acabaran las 50 preguntas, se barajan de nuevo.
  if(G.qIndex >= G.qs.length) { G.qs = shuffle(QUESTIONS); G.qIndex = 0; G.lastRenderedQ = -1; }
  
  G.currentEvent = null;
  // Aumentada probabilidad de evento al 40%
  if (Math.random() < 0.40) { G.currentEvent = EVENT_TYPES[Math.floor(Math.random() * EVENT_TYPES.length)]; sfxPowerup(); }
  
  startTurn(); render();
}

function checkGoal() { if (G.scores[G.turn] >= GOAL) { setTimeout(() => { G.screen = 'winner'; render(); }, 1800); } }

// --- PANTALLA GANADOR ---
function renderWinner() {
  clearInterval(timerInt); clearTimeout(G.iaTimeout);
  if(musicInterval) { clearInterval(musicInterval); musicInterval=null; }
  sfxWin(); document.body.classList.remove('danger-mode'); hyperSpeed = false;
  launchConfetti(); 
  
  const sorted = G.teams.map((t,i)=>({...t, score: G.scores[i]})).sort((a,b)=>b.score - a.score);
  
  let h = `<div id="toolbar-wrapper">${renderToolbarHTML()}</div>` + `
    <div class="winner-screen" style="position:relative; z-index:999">
      <div class="trophy">🏆</div>
      <h2 style="color:var(--text-muted); letter-spacing:3px">MISIÓN HARDCORE COMPLETADA</h2>
      <div style="font-size:3.5rem; font-weight:900; margin-bottom:10px; text-transform:uppercase; color:${sorted[0].color}; text-shadow: 0 0 20px ${sorted[0].color}">${sorted[0].name} TRIUNFA</div>
      <div style="display:flex; flex-wrap:wrap; gap:20px; justify-content:center; margin:40px 0; width:100%; max-width:700px;">
        ${sorted.map((t, i) => `
          <div class="glass-panel" style="flex:1; min-width:150px; position:relative; overflow:hidden; padding:25px; border-top:4px solid ${t.color}">
            <div style="font-size:1.5rem; margin-bottom:10px">${['🥇','🥈','🥉','🏅'][i] || '🎖️'} Lugar</div>
            <div style="font-size:3rem; margin:10px 0; filter:drop-shadow(0 0 10px ${t.color})">${t.ship}</div>
            <div style="font-size:1.2rem; font-weight:700">${t.name}</div>
            <div style="font-family:'Space Grotesk'; font-size:2.5rem; font-weight:900; margin-top:10px;">${t.score} PTS</div>
          </div>
        `).join('')}
      </div>
      <button class="btn btn-primary" onclick="G.screen='select_mode'; confActive=false; render();" style="margin-top:20px">IR A LA BASE (VOLVER)</button>
    </div>
  `;
  app.innerHTML = h;
}

// Inicializar Aplicación
render();
</script>
</body>
</html>
